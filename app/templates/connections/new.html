{% extends "base.html" %}
{% block title %}Add Connection - CX-View{% endblock %}
{% block content %}
<a href="/" class="back-link">&larr; Back to connections</a>
<h1>Add Connection</h1>
<div class="card">
<form method="post" action="/connections/new" class="stacked">
    <label>Tenant Name<input type="text" name="tenant_name" required></label>
    <label>Tenant ID (realm)<input type="text" name="tenant_id" required></label>
    <label>Base API URL<input type="url" name="base_api_url" placeholder="https://ast.checkmarx.net" required></label>
    <label>IAM URL<input type="url" name="iam_url" placeholder="https://iam.checkmarx.net" required></label>

    <label>Auth Method
        <select name="auth_method" id="auth_method" onchange="toggleAuthFields()">
            <option value="refresh_token">Refresh Token</option>
            <option value="client_credentials">Client Credentials</option>
        </select>
    </label>

    <div id="refresh_token_fields">
        <label>Refresh Token<input type="password" name="refresh_token"></label>
    </div>
    <div id="client_credentials_fields" style="display:none">
        <label>Client ID<input type="text" name="client_id"></label>
        <label>Client Secret<input type="password" name="client_secret"></label>
    </div>

    <button type="submit" class="btn btn-primary">Save</button>
</form>
</div>
<script src="/static/js/connections.js"></script>
{% endblock %}
