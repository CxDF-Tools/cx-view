<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CX-View{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">CX-View</a>
        {% if connection is defined and connection %}
            <span class="active-tenant">Connected: {{ connection.tenant_name }}</span>
        {% endif %}
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
