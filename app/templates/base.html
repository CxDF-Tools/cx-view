<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CX-View{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">
            <img src="/static/img/checkmarx-symbol.svg" alt="" class="brand-logo">
            <span>CX-View</span>
        </a>
        {% if connection is defined and connection %}
            <span class="active-tenant">
                <span class="status-dot status-dot-ok"></span>
                Connected: {{ connection.tenant_name }}
            </span>
        {% endif %}
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
